[project]
name = "foundry-computer"
version = "0.1.0"
description = "Self-hosted persistent computers for AI agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
opensandbox = ["opensandbox>=1.2.0rc1"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 100

